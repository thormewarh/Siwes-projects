<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Data Processing</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    padding:20px;
}

h1{
    color:#333;
}

button{
    padding:10px 15px;
    margin:10px 0;
    cursor:pointer;
}

#output{
    background:white;
    padding:15px;
    border-radius:8px;
    margin-top:20px;
}

.user{
    border-bottom:1px solid #ddd;
    padding:10px 0;
}
</style>

</head>

<body>

<h1>User Data Processing Challenge</h1>

<button id="refreshBtn">Refresh Data</button>

<div id="output"></div>

<script>

const output = document.getElementById("output");
const refreshBtn = document.getElementById("refreshBtn");

const STORAGE_KEY = "processedUsers";

async function loadUsers() {

    const savedData = localStorage.getItem(STORAGE_KEY);

    if(savedData){

        const parsedData = JSON.parse(savedData);

        displayData(parsedData.filteredUsers, parsedData.groupedCities);

        return;
    }

    try{

        const response = await fetch("https://jsonplaceholder.typicode.com/users");

        const users = await response.json();

        // Filter users whose company contains "Group"
        const filteredUsers = users.filter(user =>
            user.company.name.includes("Group")
        );

        // Group users by city
        const groupedCities = filteredUsers.reduce((groups,user)=>{

            const city = user.address.city;

            if(!groups[city]){
                groups[city]=[];
            }

            groups[city].push(user.name);

            return groups;

        },{});

        const processedData = {
            filteredUsers,
            groupedCities
        };

        localStorage.setItem(STORAGE_KEY,JSON.stringify(processedData));

        displayData(filteredUsers,groupedCities);

    }catch(error){

        output.innerHTML = "<h3>Unable to load data. Check your internet connection.</h3>";

    }

}

function displayData(filteredUsers, groupedCities){

    if(filteredUsers.length===0){

        output.innerHTML="<h3>No matching users found.</h3>";

        return;

    }

    let html="<h2>Filtered Users</h2>";

    filteredUsers.forEach(user=>{

        html+=`
        <div class="user">
            <strong>${user.name}</strong><br>
            Username: ${user.username}<br>
            Company: ${user.company.name}<br>
            City: ${user.address.city}
        </div>
        `;

    });

    html+="<h2>Users Grouped By City</h2>";

    for(const city in groupedCities){

        html+=`
        <p>
            <strong>${city}</strong> :
            ${groupedCities[city].join(", ")}
        </p>
        `;

    }

    output.innerHTML=html;

}

refreshBtn.addEventListener("click",()=>{

    localStorage.removeItem(STORAGE_KEY);

    output.innerHTML="<p>Refreshing data...</p>";

    loadUsers();

});

loadUsers();

</script>

</body>
</html>
